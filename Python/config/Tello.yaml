behaviors:
  Tello:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.93
      num_epoch: 6
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true # false
      hidden_units: 512 # 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 200000
    keep_checkpoints: 10

environment_parameters:
  size_modifier:
    curriculum:
      - name: DetectingWayPoints # The '-' is important as this is a list
        completion_criteria:
          measure: progress
          behavior: Tello
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.25
          require_reset: true
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.5
            max_value: 1.0
      - name: LargerWayPointDistances # This is the start of the second lesson
        completion_criteria:
          measure: reward
          behavior: Tello
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 100000
          require_reset: true
        value: 
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.5
            max_value: 2.0
      - name: FullSize
        value: 
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.5
            max_value: 9.0
  cbfs_active:
    curriculum:
      - name: cbfs_deactivated # The '-' is important as this is a list
        completion_criteria:
          measure: progress
          behavior: Tello
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.0 #0.3
          require_reset: true
        value: 1.0
      - name: cbfs_activated # The '-' is important as this is a list
        completion_criteria:
          measure: progress
          behavior: Tello
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
          require_reset: true
        value: 1.0

  waitAfterWayPoint: 40.0
  
env_settings:
  seed: 123

